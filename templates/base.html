<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Semantic Search Engine{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">🔍 Semantic Search</a>
            <div class="nav-links">
                <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Search</a>
                <a href="/compare" class="nav-link {% if request.path == '/compare' %}active{% endif %}">Compare Models</a>
                <a href="/about" class="nav-link {% if request.path == '/about' %}active{% endif %}">About</a>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Semantic Search Engine &mdash; E-Commerce Product Discovery System</p>
    </footer>

    <script src="{{ url_for('static', filename='js/search.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
